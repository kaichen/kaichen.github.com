{{ define "main" }}
<h1>{{ .Title }}</h1>
<ol class="postlist">
{{ range .Pages }}
<li class="postlist-item">
    <a href="{{ .Permalink }}" class="postlist-link">
        {{ if .Title }}
        <code class="postlist-item-title">{{ .Title }}</code>
        {{ else }}
        <code class="postlist-item-title">{{ .RelPermalink }}</code>
        {{ end }}
    </a>
    <time class="postlist-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    {{ if .Params.tags }}
    <div class="postlist-taglist">
        {{ range .Params.tags }}
        <span class="postlist-tag">
            <a href="/blog/categories/{{ . | urlize }}/">#{{ . }}</a>
        </span>
        {{ end }}
    </div>
    {{ end }}
</li>
{{ end }}
</ol>
{{ end }}
